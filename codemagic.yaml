workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"
        XCODE_SCHEME: "iosApp"
      node: latest
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Set up Gradle
        script: chmod +x gradlew
      - name: Generate Podspec
        script: ./gradlew :shared:podspec
      - name: Generate Dummy Framework
        script: ./gradlew :shared:generateDummyFramework
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd iosApp
          rm -rf iosApp.xcodeproj iosApp.xcworkspace
          xcodegen generate
      - name: Install Pods
        script: |
          cd iosApp
          pod install
      - name: Build iOS App (Real iPhone Unsigned)
        script: |
          set -o pipefail
          cd iosApp
          # Use standard build directory to keep CocoaPods happy
          xcodebuild build \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Debug \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | xcpretty
      - name: Package Unsigned IPA
        script: |
          # Find the built .app in standard DerivedData
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "iosApp.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -y -r MVDM_Real_Device.ipa Payload
            mv MVDM_Real_Device.ipa iosApp/
          else
            echo "ERROR: iosApp.app not found"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app"
            exit 1
          fi
    artifacts:
      - iosApp/MVDM_Real_Device.ipa

  ios-testflight-workflow:
    name: iOS TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"
        XCODE_SCHEME: "iosApp"
        APP_STORE_APPLE_ID: 6807964425
        BUNDLE_ID: com.aspigon.mvdm
      node: latest
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Set up Gradle
        script: chmod +x gradlew
      - name: Generate Podspec
        script: ./gradlew :shared:podspec
      - name: Generate Dummy Framework
        script: ./gradlew :shared:generateDummyFramework
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd iosApp
          rm -rf iosApp.xcodeproj iosApp.xcworkspace
          xcodegen generate
      - name: Install Pods
        script: |
          cd iosApp
          pod install
      - name: Use system default keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          cd iosApp
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd iosApp
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          cd iosApp
          xcode-project build-ipa \
            --workspace "iosApp.xcworkspace" \
            --scheme "iosApp"
    artifacts:
      - iosApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - mvdm test app internal
