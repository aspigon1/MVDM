workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      node: latest
      xcode: latest
    scripts:
      - name: Set up Gradle
        script: chmod +x gradlew
      - name: Build Shared Framework (Simulator)
        script: |
          ./gradlew :shared:iosSimulatorArm64Binaries :shared:iosX64Binaries --no-configuration-cache
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd iosApp
          xcodegen generate
      - name: Build iOS App (Simulator for Appetize)
        script: |
          set -o pipefail
          mkdir -p iosApp/build
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/iosApp/build \
            ONLY_ACTIVE_ARCH=YES
      - name: Package for Appetize
        script: |
          # Verify the app exists and contains Info.plist
          if [ -f "iosApp/build/iosApp.app/Info.plist" ]; then
            echo "Info.plist found. Packaging..."
            cd iosApp/build
            zip -r ../appetize_app.zip iosApp.app
          else
            echo "ERROR: iosApp.app/Info.plist not found in $PWD/iosApp/build"
            ls -R iosApp/build
            exit 1
          fi
    artifacts:
      - iosApp/appetize_app.zip
