workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      node: latest
      xcode: latest
    scripts:
      - name: Set up Gradle
        script: chmod +x gradlew
      - name: Build Shared Framework (Release)
        script: |
          ./gradlew clean :shared:assembleSharedReleaseFrameworkIosArm64 --no-configuration-cache || (./gradlew tasks --all && exit 1)
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd iosApp
          xcodegen generate
      - name: Build iOS App (IPA)
        script: |
          xcodebuild build -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphoneos -configuration Release -arch arm64 | xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - iosApp/*.app
      - shared/build/bin/iosArm64/releaseFramework/Shared.framework
