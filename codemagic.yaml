workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      node: latest
      xcode: latest
    scripts:
      - name: Set up Gradle
        script: chmod +x gradlew
      - name: Build Shared XCFramework
        script: |
          ./gradlew :shared:assembleSharedDebugXCFramework --no-configuration-cache
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd iosApp
          rm -rf iosApp.xcodeproj
          xcodegen generate
      - name: Build iOS App (Real iPhone Unsigned)
        script: |
          set -o pipefail
          mkdir -p iosApp/build
          xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj -scheme iosApp
          # Build for real physical iPhone without signing
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Debug \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/iosApp/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
      - name: Package Unsigned IPA
        script: |
          if [ -d "iosApp/build/iosApp.app" ]; then
            cd iosApp/build
            mkdir -p Payload
            mv iosApp.app Payload/
            zip -r ../MVDM_Real_Device.ipa Payload
          else
            echo "Build failed to produce valid app bundle"
            exit 1
          fi
    artifacts:
      - iosApp/MVDM_Real_Device.ipa
