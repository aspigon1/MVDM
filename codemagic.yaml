workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      node: latest
      xcode: latest
    scripts:
      - name: Set up Gradle
        script: chmod +x gradlew
      - name: Build Shared Framework (Simulator)
        script: |
          ./gradlew :shared:iosSimulatorArm64Binaries :shared:iosX64Binaries --no-configuration-cache
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd iosApp
          xcodegen generate
      - name: Build iOS App (Universal)
        script: |
          set -o pipefail
          mkdir -p iosApp/build
          # Resolve Packages
          xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj -scheme iosApp
          # Build for simulator (arm64 + x86_64)
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CONFIGURATION_BUILD_DIR=$PWD/iosApp/build \
            ONLY_ACTIVE_ARCH=NO
      - name: Package for Appetize
        script: |
          if [ -d "iosApp/build/iosApp.app" ]; then
            cd iosApp/build
            zip -y -r ../appetize_app.zip iosApp.app
          else
            echo "Build failed to produce valid app bundle"
            ls -R iosApp/build
            exit 1
          fi
    artifacts:
      - iosApp/appetize_app.zip
