workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      node: latest
      xcode: latest
    scripts:
      - name: Set up Gradle
        script: chmod +x gradlew
      - name: Build Shared Framework (Simulator for Appetize)
        script: |
          ./gradlew :shared:iosSimulatorArm64Binaries --no-configuration-cache
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd iosApp
          xcodegen generate
      - name: Build iOS App (Simulator for Appetize)
        script: |
          mkdir -p iosApp/build
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR=$PWD/iosApp/build \
            ONLY_ACTIVE_ARCH=NO | xcpretty
      - name: Package for Appetize
        script: |
          cd iosApp/build
          zip -r ../appetize_app.zip iosApp.app
    artifacts:
      - iosApp/appetize_app.zip
