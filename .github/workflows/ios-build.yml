name: iOS Build Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build KMP iOS Framework (Simulator)
      run: ./gradlew :shared:assembleSharedDebugFrameworkIosSimulatorArm64

    - name: Verify Build
      run: |
        if [ -d "shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework" ]; then
          echo "Shared Framework built successfully"
        else
          echo "Shared Framework build failed"
          exit 1
        fi

    - name: Upload KMP Framework Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shared-framework-debug
        path: shared/build/bin/iosSimulatorArm64/debugFramework/

