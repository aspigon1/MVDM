name: iosApp
options:
  bundleIdPrefix: com.aspigon1.mvdm
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.0.0
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: 
      - path: iosApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aspigon1.mvdm.iosApp
      INFOPLIST_FILE: iosApp/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/../shared/build/bin/iosSimulatorArm64/debugFramework
      OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework
        embed: true
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
