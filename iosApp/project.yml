name: iosApp
options:
  bundleIdPrefix: com.aspigon1.mvdm
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: 
      - path: iosApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aspigon1.mvdm.iosApp
      INFOPLIST_FILE: iosApp/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ARCHS: arm64
      VALID_ARCHS: arm64
      ONLY_ACTIVE_ARCH: YES
      OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/Shared.xcframework
        embed: true
